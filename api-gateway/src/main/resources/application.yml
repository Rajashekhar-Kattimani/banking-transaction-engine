server:
  port: 9080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
           cors-configurations:
             '[/**]':
               allowedOrigins:
                 - "http://localhost:4200"
               allowedMethods:
                 - GET
                 - POST
                 - PUT
                 - PATCH
                 - DELETE
                 - OPTIONS
               allowedHeaders:
                 - "*"
               allowCredentials: true
          routes:
            - id: auth-service
              uri: http://localhost:9081
              predicates:
                - Path=/api/v1/auth/**

            - id: account-service
              uri: http://localhost:9082
              predicates:
                - Path=/api/v1/accounts/**

            - id: transaction-service
              uri: http://localhost:9083
              predicates:
                - Path=/api/v1/transactions/**

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always

bank:
  security:
    jwt:
      issuer: banking-transaction-engine
      # The gateway must accept tokens issued for the API clients. Use
      # the same audience as the auth-service (banking-clients) so JWTs
      # generated by the auth-service are accepted by the gateway.
      audience: banking-clients
      secret: qVYGbrfWw6+03VwPCCLk/BJ/75etRP8Sepop+I+lMmA=
      access-token-expiration: 900000
      refresh-token-expiration: 604800000