server:
  port: 9083

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: true

banking:
  services:
    account-service:
      url: http://localhost:9082

bank:
  security:
    jwt:
      issuer: banking-transaction-engine
      audience: banking-clients
      secret: qVYGbrfWw6+03VwPCCLk/BJ/75etRP8Sepop+I+lMmA=
      access-token-expiration: 900000
      refresh-token-expiration: 604800000

  messaging:
    kafka:
      bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info